<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-text">SKYLINE</span>
      <span class="logo-sub">RESIDENCIAL</span>
    </div>
    <h1 class="login-title">Acceso Administración</h1>

    <form class="login-form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          placeholder="admin"
          [disabled]="loading"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [disabled]="loading"
        />
      </div>

      @if (error) {
        <p class="login-error">{{ error }}</p>
      }

      <button type="submit" class="login-btn" [disabled]="loading || !username || !password">
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
